plugins:
  - rubocop-performance
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'vendor/**/*'
    - 'pkg/**/*'

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

Naming/PredicateMethod:
  AllowedMethods:
    - verify_xml

Naming/VariableNumber:
  AllowedIdentifiers:
    - date_102
    - en16931

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - '*.gemspec'
