name: Setup Ghostscript
description: Install Ghostscript and its Factur-X composition script

runs:
  using: composite
  steps:
    - name: Install Ghostscript
      shell: bash
      run: sudo apt-get update && sudo apt-get install --yes ghostscript
    - name: Install pinned zugferd.ps
      shell: bash
      env:
        ZUGFERD_PS_SHA256: 09b9ee7f65d9ead04e3fdcff2f6b0843d303187e1d301365b6c314e39cc3fd25
        ZUGFERD_PS_URL: https://raw.githubusercontent.com/ArtifexSoftware/ghostpdl/ghostpdl-10.03.1/lib/zugferd.ps
      run: |
        path="$RUNNER_TEMP/zugferd.ps"
        curl --fail --location --silent --show-error "$ZUGFERD_PS_URL" --output "$path"
        echo "$ZUGFERD_PS_SHA256  $path" | sha256sum --check --strict
        echo "EU_EINVOICE_ZUGFERD_PS=$path" >> "$GITHUB_ENV"
