name: Release

on:
  push:
    tags:
      - 'eu-einvoice-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ruby -r ./gems/eu-einvoice/lib/eu_einvoice/version -e 'abort "Tag/version mismatch" unless ENV.fetch("RELEASE_TAG") == "eu-einvoice-v#{EuEinvoice::VERSION}"'
      - run: bundle exec rake build_all
      - run: bundle exec ruby tooling/verify_packages.rb
      - uses: rubygems/configure-rubygems-credentials@6861877652452567c1a007a50badad3d316fc9ba
      - name: Publish packages
        run: bundle exec ruby tooling/publish_packages.rb
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" pkg/*.gem --title "$RELEASE_TAG" --notes-file docs/architecture/release-notes.md
