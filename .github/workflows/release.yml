name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Build gems
        run: bundle exec rake build_all
      - uses: rubygems/configure-rubygems-credentials@f5a32efa94076b80b28556b2d3b04cb3707b6df1
      - name: Push gems to RubyGems
        run: |
          for gem in \
            "pkg/facturx-${GITHUB_REF_NAME#v}.gem" \
            "pkg/facturx-schematron-${GITHUB_REF_NAME#v}.gem"
          do
            output=$(gem push "$gem" 2>&1) || {
              if echo "$output" | grep -Eqi 'already been pushed|repushing of gem versions is not allowed'; then
                echo "skip: $gem already on RubyGems"
              else
                echo "$output"
                exit 1
              fi
            }
            echo "$output"
          done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=$(awk -v v="${TAG#v}" '
            $0 ~ "^## \\[" v "\\]" {grab=1; next}
            grab && /^## \[/ {exit}
            grab && /^\[[^]]+\]:/ {exit}
            grab {print}
          ' CHANGELOG.md)
          if [ -z "$notes" ]; then
            notes="See [CHANGELOG.md](CHANGELOG.md)."
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes "$notes"
          else
            gh release create "$TAG" --title "$TAG" --notes "$notes"
          fi
